<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math Loop Cards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Fredoka', sans-serif;
      }
      /* Custom Scrollbar for the card list */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      /* Card Flip Animation */
      @keyframes flipIn {
        0% {
          transform: perspective(1000px) rotateY(-90deg) scale(0.8);
          opacity: 0;
        }
        100% {
          transform: perspective(1000px) rotateY(0deg) scale(1);
          opacity: 1;
        }
      }
      .animate-flip-in {
        animation: flipIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      /* Deal Card Animation (Fly in from center top) */
      @keyframes dealCard {
        0% {
          transform: translate(0, -50vh) scale(0.2) rotate(180deg);
          opacity: 0;
        }
        100% {
          transform: translate(0, 0) scale(1) rotate(0deg);
          opacity: 1;
        }
      }
      .animate-deal {
        animation: dealCard 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      }

      /* Winner Pop Animation */
      @keyframes winnerPop {
          0% { transform: scale(0.5); opacity: 0; }
          60% { transform: scale(1.1); opacity: 1; }
          100% { transform: scale(1); }
      }
      .animate-winner-pop {
          animation: winnerPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      /* Simple Confetti Animation */
      @keyframes confettiFall {
          0% { transform: translateY(0) rotate(0deg); opacity: 1; }
          100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
      }
      .confetti {
          animation-name: confettiFall;
          animation-timing-function: linear;
          animation-iteration-count: infinite;
      }

      /* Floating Animation */
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
        100% { transform: translateY(0px); }
      }
      .animate-float {
        animation: float 4s ease-in-out infinite;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",

    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
